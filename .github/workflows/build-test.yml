name: Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "docs/**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Test all packages
        run: bun test
