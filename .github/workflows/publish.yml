name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        package:
          - core
          - events
          - ids
          - outbox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build --filter @tact-ddd/${{ matrix.package }}

      - name: Set version (release trigger)
        if: github.event_name == 'release'
        working-directory: ./packages/${{ matrix.package }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          bun version $VERSION --no-git-tag-version

      - name: Publish to NPM
        working-directory: ./packages/${{ matrix.package }}
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
